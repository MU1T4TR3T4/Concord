# Publica o instalador do Windows como Release do GitHub quando uma tag vX.Y.Z é enviada.
# É dessa Release que o app instalado baixa a atualização automática.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # A tag tem de bater com a versão do package.json, senão o app não acha a atualização.
      - name: Conferir versão
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Gerar instalador
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee build.log || {
            tail -n 25 build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      # O app procura latest.yml, o instalador e o .blockmap na Release da versão.
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Concord $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release/Concord-Setup-*.exe release/Concord-Setup-*.exe.blockmap release/latest.yml --clobber
